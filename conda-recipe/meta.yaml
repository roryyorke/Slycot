{% set version = "0.6.2.dev15+g8d66dd0a3" %}
{% set name = "slycot" %}

package:
  name: slycot
  version: {{ version }}

source:
  git_url: ../

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python >=3.10
    - scikit-build-core
    - numpy
    - pip
  run:
    - python >=3.10
    - numpy >=2

test:
  imports:
    - slycot
  commands:
    - pip check
  requires:
    - pip
    - python

about:
  summary: A wrapper for the SLICOT control and systems library
  license: GPLv2
  license_file:
    - COPYING
    - slycot/src/SLICOT-Reference/LICENSE

extra:
  recipe-maintainers:
    - AddYourGitHubIdHere
