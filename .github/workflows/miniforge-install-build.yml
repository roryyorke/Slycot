name: Install miniforge + conda-build

on:
  push:
  pull_request:

jobs:
  install-miniforge:
    name: Install miniforge latest
    runs-on: "windows-latest"
    steps:
      - name: Download miniforge
        run: |
          curl.exe --location --output Miniforge3-Windows-x86_64.exe https://github.com/conda-forge/miniforge/releases/latest/download/Miniforge3-Windows-x86_64.exe
      - name: Install miniforge
        shell: cmd
        run: |
          start "miniforge install" /wait "Miniforge3-Windows-x86_64.exe" /InstallationType=JustMe /RegisterPython=0 /S /D=%UserProfile%\Miniforge3
      - name: setup miniforge
        shell: cmd
        run: |
          %UserProfile%\Miniforge3\bin\conda.exe init
      - name: run conda help
        shell: cmd
        run: |
          conda.exe --help
      - name: install conda build
        shell: cmd
        run: |
          conda.exe install -n base conda-build
      - name: run conda build --help
        shell: cmd
        run: |
          conda.exe build --help
