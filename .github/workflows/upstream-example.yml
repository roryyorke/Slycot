name: Conda build fail MWE

on:
  push:
  pull_request:

jobs:
  conda-build-mwe:
    name: Run conda build --help
    runs-on: "windows-latest"
    steps:
      - name: Setup Conda
        uses: conda-incubator/setup-miniconda@v4
        with:
          conda-build-version: 26.9.1
      - name: Powershell
        shell: powershell
        run: |
          conda build --help
