name: cibuildwheel

on: [push, pull_request]

jobs:

  build-sdist:
    # Super fast sniff build. If this fails, don't start the other jobs
    name: Build sdist on Ubuntu
    runs-on: ubuntu-latest
    outputs:
      sdist-id: ${{ steps.artifact-upload-step.outputs.artifact-id }}

    steps:
      - name: Checkout Slycot
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: 'recursive'

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Create Slycot sdist
        run: |
          pip install build
          python -m build --sdist
          [ $(find dist -type f|wc -l) -eq 1 ] || { echo "Expect 1 file in dist" 1>&2; exit 1; }
          echo "sdist=$(find dist -type f)" >> "$GITHUB_ENV"

      - name: Install build requirements
        run: sudo apt-get update --quiet --yes && sudo apt-get install --quiet --yes liblapack-dev

      - name: Install sdist
        run: |
          set -eux
          echo sdist is $sdist
          echo github context env.sdist is ${{ env.sdist }}
          pip install -v "$sdist[test]"

      - name: Run tests
        run: |
          pytest --pyargs slycot

      - name: Upload sdist
        uses: actions/upload-artifact@v7
        id: artifact-upload-step
        with:
            archive: false
            if-no-files-found: error
            path: ${{ env.sdist }}


  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    needs: build-sdist
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest] #, ubuntu-24.04-arm, windows-latest, macos-15-intel, macos-14]
    env:
      CIBW_ENVIRONMENT: "CMAKE_ARGS='-DSLYCOT_BUNDLE_OPENBLAS=ON'"
      CIBW_BUILD: "cp313-manylinux_x86_64"

    steps:

      - name: Get sdist
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{needs.build-sdist.outputs.sdist-id}}
          # todo: check if this is needed
          skip-decompress: true

      - name: Unpack sdist
        run: tar xzf ${{ env.sdist }} --strip-components=1

      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: macos-config
        if: startsWith(matrix.os, 'macos')
        # run a script that setups up commands slycot-gcc and slycot-gfortran
        # these will be used in build and repair stages
        run: |
          bash ./build-tools/gha_cibw_setup_macos.sh
          echo SKBUILD_CMAKE_ARGS="-G Ninja;-DCMAKE_Fortran_COMPILER=slycot-gfortran;-DCMAKE_C_COMPILER=slycot-gcc" >> $GITHUB_ENV

      - name: macos-deployment-target-14
        if: startsWith(matrix.os, 'macos-14')
        run: echo MACOSX_DEPLOYMENT_TARGET=14.0 >> $GITHUB_ENV

      - name: macos-deployment-target-15
        if: startsWith(matrix.os, 'macos-15')
        run: echo MACOSX_DEPLOYMENT_TARGET=15.0 >> $GITHUB_ENV

      - name: windows-config
        if: startsWith(matrix.os, 'windows')
        run: |
          echo SKBUILD_CMAKE_ARGS="-G Ninja;-DCMAKE_Fortran_COMPILER=c:/mingw64/bin/gfortran.exe;-DCMAKE_C_COMPILER=c:/mingw64/bin/gcc.exe" >> $env:GITHUB_ENV

      - name: Install cibuildwheel
        run: python -m pip install cibuildwheel==3.3.1

      - name: Build wheels
        run:  python -m cibuildwheel --output-dir wheelhouse

      - uses: actions/upload-artifact@v6
        with:
          name: cibw-wheels-${{ matrix.os }}-${{ strategy.job-index }}
          path: ./wheelhouse/*.whl
