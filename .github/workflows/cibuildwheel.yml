name: cibuildwheel

on: [push, pull_request]

jobs:
  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest]
    env:
      CIBW_ENVIRONMENT: "CMAKE_ARGS='-DSLYCOT_BUNDLE_OPENBLAS=ON'"
      SKBUILD_BUILD_VERBOSE: true

    steps:

      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: 'recursive'

      - uses: actions/setup-python@v6

      - name: macos-config
        if: startsWith(matrix.os, 'macos')
        # run a script that setups up commands slycot-gcc and slycot-gfortran
        # these will be used in build and repair stages
        run: |
          bash ./build-tools/gha_cibw_setup_macos.sh
          echo SKBUILD_CMAKE_ARGS="-G Ninja;-DCMAKE_Fortran_COMPILER=slycot-gfortran;-DCMAKE_C_COMPILER=slycot-gcc" >> $GITHUB_ENV

      - name: macos-deployment-target-14
        if: startsWith(matrix.os, 'macos-14')
        run: echo MACOSX_DEPLOYMENT_TARGET=14.0 >> $GITHUB_ENV

      - name: macos-deployment-target-15
        if: startsWith(matrix.os, 'macos-15')
        run: echo MACOSX_DEPLOYMENT_TARGET=15.0 >> $GITHUB_ENV

      - name: windows-config
        if: startsWith(matrix.os, 'windows')
        # TODO: equivalent of command -v for gcc, gfortran
        # why does CMake find objcopy but not gfortran?  try just "gfortran".
        run: |
          echo SKBUILD_CMAKE_ARGS="-G Ninja;-DCMAKE_Fortran_COMPILER=c:/mingw64/bin/gfortran.exe;-DCMAKE_C_COMPILER=c:/mingw64/bin/gcc.exe;-DCFLAGS=-m32" >> $env:GITHUB_ENV

      - name: Install cibuildwheel
        run: python -m pip install cibuildwheel==3.3.1

      - name: Build wheels
        run:  python -m cibuildwheel --output-dir wheelhouse

      - uses: actions/upload-artifact@v6
        with:
          name: cibw-wheels-${{ matrix.os }}-${{ strategy.job-index }}
          path: ./wheelhouse/*.whl
