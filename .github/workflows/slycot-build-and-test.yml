name: Build and Test Slycot
on:
  push:
  pull_request:
    paths-ignore:
      - '.gitignore'
      - 'AUTHORS'
      - 'COPYING'
      - 'gpl-2.0.txt'
      - 'MANIFEST.in'
      - 'README.rst'

jobs:

  build:
    name: Build ${{ matrix.os }} ${{ matrix.python }}
    runs-on: ${{ matrix.os }}-latest
    strategy:
        fail-fast: false
        matrix:
          os:
            - 'windows'
          python:
            - '3.13'

    steps:
      - name: Checkout Slycot
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          submodules: 'recursive'
      - name: install python-build
        run: pip install build
      - name: build
        run: python -m build "--config-setting=cmake.args=-G Ninja" "--config-setting=cmake.args=-DCMAKE_C_COMPILER=clang" "--config-setting=cmake.args=-DCMAKE_Fortran_COMPILER=flang" .
