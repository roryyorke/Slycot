name: Build and Test Slycot
on:
  push:
  pull_request:
    paths-ignore:
      - '.gitignore'
      - 'AUTHORS'
      - 'COPYING'
      - 'gpl-2.0.txt'
      - 'MANIFEST.in'
      - 'README.rst'

jobs:

  build:
    name: Build ${{ matrix.os }} ${{ matrix.python }}
    runs-on: ${{ matrix.os }}-latest
    strategy:
        fail-fast: false
        matrix:
          os:
            - 'windows'
          python:
            - '3.13'

    steps:
      - name: Checkout Slycot
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          submodules: 'recursive'
      - uses: fortran-lang/setup-fortran@v1
        id: setup-fortran
        with:
          compiler: gfortran
          version: 'latest'

      - name: install python-build
        run: pip install build
      - name: build
        run: |
          ${{ steps.setup-fortran.outputs.fc }}
          # ${{ steps.setup-fortran.outputs.cc }} # needed?
          python -m build "--config-setting=cmake.args=-G Ninja"
